version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Disable routine version-bump PRs. Dependabot security updates are not
    # subject to this limit and remain enabled in the repository settings.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Unlike npm, the Dockerfile base image has no security-update path: GitHub
    # security alerts track package advisories, not the Node.js or Debian patch
    # level inside node:<version>-bookworm-slim. Allow one routine PR at a time
    # so the pinned tag and digest follow Node.js 24 security releases and
    # Debian rebuilds instead of staying frozen.
    open-pull-requests-limit: 1
    ignore:
      # Moving the container to another Node.js major is a deliberate change,
      # not a routine base-image refresh.
      - dependency-name: node
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

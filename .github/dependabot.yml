version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Disable routine version-bump PRs. Dependabot security updates are not
    # subject to this limit and remain enabled in the repository settings.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Unlike npm, the base image is not covered by Dependabot security
    # updates, so OS and Node.js security patches for the digest-pinned
    # node:24-bookworm-slim only arrive through these version-update PRs.
    open-pull-requests-limit: 2
    labels:
      - dependencies

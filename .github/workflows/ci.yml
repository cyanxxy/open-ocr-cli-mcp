name: CI Pipeline

on:
  push:
    branches: [ main ]
  # Every pull request, including one stacked on another branch: a stack's
  # upper PRs otherwise get no feedback until the lower ones merge.
  pull_request:
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

concurrency:
  # Main version-bump commits must finish their own CI so later ordinary pushes
  # cannot cancel the only exact commit eligible for automatic publication.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Quality checks, tests, and security audit. Security was folded into this job
  # so the workspace's `npm ci` is reused instead of installing a second time in
  # a dedicated job (audit O-07).
  quality:
    # Check names come from the lane, not the Node version, so branch
    # protection keeps matching when a lane moves to a newer Node release.
    name: Code Quality & Tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    # Hard cap so a hung test can never wedge the runner indefinitely (audit Q-01).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The advertised minimum (22.13.0), Node 24 (Maintenance LTS since
        # 2026-10-20) and Node 26 (Active LTS since 2026-10-28). The expensive
        # static/coverage gates run once, on the current lane.
        include:
          - lane: minimum
            node-version: 22.13.0
          - lane: previous
            node-version: 24.x
          - lane: current
            node-version: 26.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test release and packaging scripts
        run: node --test scripts/*.test.mjs

      # The release workflow rejects a version whose changelog section lacks
      # headings or a comparison link; check it before merge, not after tagging.
      - name: Check release notes for the current version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          # The script prefers GITHUB_REF_NAME (a tag in release runs); on a PR
          # that is "<n>/merge", so point it at the version being released.
          GITHUB_REF_NAME="v$VERSION" node scripts/assert-release-version.mjs
          node scripts/extract-release-notes.mjs "v$VERSION" "$RUNNER_TEMP/release-notes.md"

      - name: Type check
        if: ${{ matrix.lane == 'current' }}
        run: npm run typecheck

      - name: Lint code
        if: ${{ matrix.lane == 'current' }}
        run: npm run lint

      - name: Run tests with coverage
        if: ${{ matrix.lane == 'current' }}
        run: npm run test:coverage

      - name: Run tests
        if: ${{ matrix.lane != 'current' }}
        run: npm test

      - name: Validate AI eval fixtures
        if: ${{ matrix.lane == 'current' }}
        run: npm run evals:validate && npm run evals:matrix:check

      - name: Check for vulnerabilities
        if: ${{ matrix.lane == 'current' }}
        run: npx audit-ci --config audit-ci.json

      - name: Upload coverage to Codecov
        # Only publish coverage from a single matrix leg to avoid duplicate uploads.
        if: ${{ matrix.lane == 'current' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Packaging smokes (separate runner, so it installs once for the smoke steps).
  build:
    # Keep this check name stable: main branch protection requires it.
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test packed CLI installation
        run: npm run cli:install-smoke

      - name: Smoke-test GitHub Action wrapper
        run: npm run action:smoke

      - name: Pack CLI for the Homebrew and local action smokes
        id: cli-package
        shell: bash
        run: |
          tarball=$(npm pack ./packages/cli --pack-destination "$RUNNER_TEMP" | tail -n 1)
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # The attached formula installs with std_npm_args; mirror it before release.
      - name: Smoke-test Homebrew-style installation
        run: node scripts/smoke-homebrew-install.mjs "${{ steps.cli-package.outputs.tarball }}"

      # The composite action must not replace a supported Node.js the job
      # already set up: setup-node's PATH change lasts for the rest of the job.
      - name: Run local action on the job's Node.js
        uses: ./
        env:
          OPEN_OCR_ACTION_PACKAGE: ${{ steps.cli-package.outputs.tarball }}
        with:
          inputs: evals/corpus/raster/invoice.png
          provider: kimi
          output: ${{ runner.temp }}/action-output
          dry-run: 'true'

      - name: Verify the action kept the job's Node.js
        shell: bash
        env:
          EXPECTED_NODE: ${{ steps.cli-package.outputs.node }}
        run: |
          actual=$(node --version)
          if [[ "$actual" != "$EXPECTED_NODE" ]]; then
            echo "The action switched the job from Node.js $EXPECTED_NODE to $actual" >&2
            exit 1
          fi

      # Keep Build Application's required check name stable while validating
      # the current build runtime, the oldest supported consumer, and the
      # Active LTS line.
      - name: Setup minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Smoke-test engine-strict CLI installation on Node 22
        run: npm run cli:install-smoke

      - name: Setup Active LTS Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
          package-manager-cache: false

      - name: Smoke-test engine-strict CLI installation on Node 26
        run: npm run cli:install-smoke

  # Release workflows publish a multi-architecture image. CI performs the
  # cheaper single-platform smoke on protected main pushes, not on every PR.
  container:
    name: Build CLI Container
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build CLI container
        run: docker build --tag open-ocr-cli:ci .

      - name: Verify non-root work directory is writable
        run: docker run --rm --entrypoint sh open-ocr-cli:ci -c 'test -w /work'

      # Fails when the image runs another Node.js than its pinned tag names, and
      # warns when that release misses a newer security release on its line.
      - name: Check container Node.js release
        run: node scripts/check-container-node.mjs --image-version "$(docker run --rm --entrypoint node open-ocr-cli:ci -p process.version)"

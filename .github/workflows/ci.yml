name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]

permissions:
  contents: read

concurrency:
  # Main version-bump commits must finish their own CI so later ordinary pushes
  # cannot cancel the only exact commit eligible for automatic publication.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Quality checks, tests, and security audit. Security was folded into this job
  # so the workspace's `npm ci` is reused instead of installing a second time in
  # a dedicated job (audit O-07).
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    # Hard cap so a hung test can never wedge the runner indefinitely (audit Q-01).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Exercise the advertised 20.x and 22.x minimums, the 24.x line used
        # for release builds, and Node 26 (the current LTS line). Node 20 is
        # end-of-life but stays until the next major drops it from `engines`.
        # The expensive static/coverage gates only need to run once on Node 24.
        node-version: [20.19.0, 22.13.0, 24.x, 26.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test release automation
        run: node --test scripts/release-automation.test.mjs

      # The release workflow rejects a version whose changelog section lacks
      # headings or a comparison link; check it before merge, not after tagging.
      - name: Check release notes for the current version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          # An explicit tag argument takes precedence over GITHUB_REF_NAME,
          # which on a PR is "<n>/merge" rather than a release tag.
          node scripts/assert-release-version.mjs "v$VERSION"
          node scripts/extract-release-notes.mjs "v$VERSION" "$RUNNER_TEMP/release-notes.md"

      - name: Type check
        if: ${{ matrix.node-version == '24.x' }}
        run: npm run typecheck

      - name: Lint code
        if: ${{ matrix.node-version == '24.x' }}
        run: npm run lint

      - name: Run tests with coverage
        if: ${{ matrix.node-version == '24.x' }}
        run: npm run test:coverage

      - name: Run tests
        if: ${{ matrix.node-version != '24.x' }}
        run: npm test

      - name: Validate AI eval fixtures
        if: ${{ matrix.node-version == '24.x' }}
        run: npm run evals:validate && npm run evals:matrix:check

      - name: Check for vulnerabilities
        if: ${{ matrix.node-version == '24.x' }}
        run: npx audit-ci --config audit-ci.json

      - name: Upload coverage to Codecov
        # Only publish coverage from a single matrix leg to avoid duplicate uploads.
        if: ${{ matrix.node-version == '24.x' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Packaging smokes (separate runner, so it installs once for the smoke steps).
  build:
    # Keep this check name stable: main branch protection requires it.
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test packed CLI installation
        run: npm run cli:install-smoke

      - name: Smoke-test GitHub Action wrapper
        run: npm run action:smoke

      # Keep Build Application's required check name stable while validating
      # the current build runtime, the current LTS line, and the oldest
      # supported consumer.
      - name: Setup current LTS Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.x'
          package-manager-cache: false

      - name: Smoke-test engine-strict CLI installation on Node 26
        run: npm run cli:install-smoke

      - name: Setup minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'
          package-manager-cache: false

      - name: Smoke-test engine-strict CLI installation on Node 20
        run: npm run cli:install-smoke

  # Release workflows publish a multi-architecture image. CI performs the
  # cheaper single-platform smoke on protected main pushes, not on every PR.
  container:
    name: Build CLI Container
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build CLI container
        run: docker build --tag open-ocr-cli:ci .

      - name: Verify non-root work directory is writable
        run: docker run --rm --entrypoint sh open-ocr-cli:ci -c 'test -w /work'

      # Run the real entrypoint: these commands need no credentials or network.
      - name: Run CLI inside the container
        shell: bash
        run: |
          expected_version=$(node -p "require('./packages/cli/package.json').version")
          actual_version=$(docker run --rm --network none open-ocr-cli:ci --version)
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Container reported version '$actual_version', expected '$expected_version'" >&2
            exit 1
          fi
          docker run --rm --network none open-ocr-cli:ci providers --json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const providers = JSON.parse(input);
              if (!Array.isArray(providers) || !providers.some((provider) => provider.id === "openrouter")) process.exit(1);
            });
          '

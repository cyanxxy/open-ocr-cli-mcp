name: AI Evals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

# Read-only by default. The eval job holds provider secrets and runs the eval
# code with a read-only token; only publish-report gets contents: write.
permissions:
  contents: read

concurrency:
  group: ai-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-evals:
    name: Run AI Evals
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Scheduled reports and their commits must always use the authoritative
    # default branch, including manually-dispatched runs.
    if: github.repository == 'cyanxxy/open-ocr-cli-mcp' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      # Set only when a fresh report was uploaded for publish-report.
      report-artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate eval fixtures
        run: npm run evals:validate && npm run evals:matrix:check

      # Keep provider credentials away from checkout/setup actions and expose
      # only non-secret booleans to later step conditions.
      - name: Detect configured eval providers
        id: credentials
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          [[ -n "$GEMINI_API_KEY" ]] && gemini=true || gemini=false
          [[ -n "$MOONSHOT_API_KEY" ]] && kimi=true || kimi=false
          [[ -n "$OPENROUTER_API_KEY" ]] && openrouter=true || openrouter=false
          [[ -n "$META_API_KEY" ]] && muse=true || muse=false
          {
            echo "gemini=$gemini"
            echo "kimi=$kimi"
            echo "openrouter=$openrouter"
            echo "muse=$muse"
          } >> "$GITHUB_OUTPUT"

      - name: Skip live evals when no provider credentials are configured
        if: ${{ steps.credentials.outputs.gemini == 'false' && steps.credentials.outputs.kimi == 'false' && steps.credentials.outputs.openrouter == 'false' && steps.credentials.outputs.muse == 'false' }}
        run: echo "No provider API keys are configured; skipping live evals."

      # Each provider run is independent: continue-on-error keeps one failing
      # provider from skipping the others or the report publication, and the
      # final step below fails the job so a failure is never hidden.
      - name: Run Kimi live canary
        id: kimi
        if: ${{ steps.credentials.outputs.kimi == 'true' }}
        continue-on-error: true
        run: npm run evals:canary
        env:
          EVAL_PROVIDER: kimi
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPEN_OCR_MODEL: kimi-k3.1-pro

      - name: Run OpenRouter live canary
        id: openrouter
        if: ${{ steps.credentials.outputs.openrouter == 'true' }}
        continue-on-error: true
        run: npm run evals:canary
        env:
          EVAL_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPEN_OCR_MODEL: anthropic/claude-sonnet-5.5

      - name: Run Muse live canary
        id: muse
        if: ${{ steps.credentials.outputs.muse == 'true' }}
        continue-on-error: true
        run: npm run evals:canary
        env:
          EVAL_PROVIDER: muse
          META_API_KEY: ${{ secrets.META_API_KEY }}
          OPEN_OCR_MODEL: muse-spark-1.3

      # Canary runs also write evals/reports/latest.*. Only the full Gemini run
      # is published, so restore the committed report first: a Gemini run that
      # crashes before writing its summary then leaves no diff to publish.
      - name: Restore committed eval report before the Gemini run
        if: ${{ steps.credentials.outputs.gemini == 'true' }}
        run: git restore --source=HEAD -- evals/reports/latest.json evals/reports/latest.md

      - name: Run live evals
        id: gemini
        if: ${{ steps.credentials.outputs.gemini == 'true' }}
        continue-on-error: true
        run: npm run evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPEN_OCR_MODEL: gemini-3.8-flash

      # A run whose quality gate fails still writes a complete summary; publish
      # it so regressions are visible in the committed report.
      - name: Detect a fresh Gemini report
        id: report
        if: ${{ steps.gemini.outcome == 'success' || steps.gemini.outcome == 'failure' }}
        shell: bash
        run: |
          if git diff --quiet -- evals/reports/latest.json; then
            echo "The Gemini run did not change evals/reports/latest.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh markdown report
        if: ${{ steps.report.outputs.changed == 'true' }}
        run: npm run evals:report

      - name: Upload eval report for publication
        id: upload
        if: ${{ steps.report.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            evals/reports/latest.json
            evals/reports/latest.md

      - name: Fail if any eval run failed
        if: ${{ steps.kimi.outcome == 'failure' || steps.openrouter.outcome == 'failure' || steps.muse.outcome == 'failure' || steps.gemini.outcome == 'failure' }}
        env:
          KIMI: ${{ steps.kimi.outcome }}
          OPENROUTER: ${{ steps.openrouter.outcome }}
          MUSE: ${{ steps.muse.outcome }}
          GEMINI: ${{ steps.gemini.outcome }}
        run: |
          echo "::error::Eval outcomes: kimi=${KIMI:-skipped} openrouter=${OPENROUTER:-skipped} muse=${MUSE:-skipped} gemini=${GEMINI:-skipped}"
          exit 1

  # Only this job can write to the repository, and it never receives provider
  # credentials or runs the eval code: it commits the uploaded report files.
  publish-report:
    name: Publish Eval Report
    needs: run-evals
    # Publish even when an eval run failed (the job above fails afterwards so
    # the failure stays visible), but not when the workflow was cancelled.
    if: ${{ !cancelled() && needs.run-evals.outputs.report-artifact-id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download eval report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eval-report-${{ github.run_id }}
          path: evals/reports

      - name: Commit updated eval reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main advanced during the eval run; refusing to publish a stale report."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- evals/reports/latest.json evals/reports/latest.md; then
            echo "No eval report changes to commit."
            exit 0
          fi
          git add evals/reports/latest.json evals/reports/latest.md
          git commit -m "chore: refresh AI eval reports"
          gh auth setup-git
          git push origin HEAD:main
